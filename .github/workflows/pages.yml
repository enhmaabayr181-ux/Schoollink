name: Deploy SchoolHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build project-path version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const out = path.join(root, '_site');
          const excluded = new Set(['.git', '.github', '_site']);
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });

          function copyTree(src, dest) {
            fs.mkdirSync(dest, { recursive: true });
            for (const entry of fs.readdirSync(src, { withFileTypes: true })) {
              if (excluded.has(entry.name)) continue;
              const from = path.join(src, entry.name);
              const to = path.join(dest, entry.name);
              if (entry.isDirectory()) copyTree(from, to);
              else fs.copyFileSync(from, to);
            }
          }
          copyTree(root, out);

          const textExtensions = new Set(['.html', '.js', '.css', '.json', '.webmanifest']);
          function rewriteTree(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) rewriteTree(file);
              else if (textExtensions.has(path.extname(entry.name))) {
                let source = fs.readFileSync(file, 'utf8');
                source = source.replace(/(["'`])\/(?!\/|Schoollink\/)/g, '$1/Schoollink/');
                fs.writeFileSync(file, source);
              }
            }
          }
          rewriteTree(out);
          fs.writeFileSync(path.join(out, '.nojekyll'), '');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
