<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolLink Live Test</title><style>
:root{--v:#6c63ff;--bg:#f6f7fb;--ink:#17181c;--muted:#747b87;--line:#e7e9ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(700px 400px at 20% -10%,#eceaff,transparent 60%),var(--bg);color:var(--ink)}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:900;font-size:24px}.brand span{color:var(--v)}.card{background:#fff;border:1px solid #fff;border-radius:28px;box-shadow:0 20px 60px rgba(30,35,60,.08);padding:22px}.auth{max-width:440px;margin:7vh auto}.auth h1{font-size:32px;margin:0 0 8px}.muted{color:var(--muted)}input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:15px;margin:7px 0;outline:none}button{border:0;border-radius:15px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:white;width:100%;margin-top:8px}.ghost{background:#f2f1ff;color:var(--v);width:100%;margin-top:8px}.hidden{display:none!important}.hero{background:linear-gradient(145deg,#17181d,#302d47);color:white}.hero small{color:#c9c8d7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.stat{background:#fafafd;border:1px solid var(--line);border-radius:20px;padding:18px}.stat b{display:block;font-size:28px}.schools{display:grid;gap:10px;margin-top:14px}.school{border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;justify-content:space-between;gap:12px}.school small{display:block;color:var(--muted);margin-top:4px}.pill{padding:6px 9px;background:#f0efff;color:var(--v);border-radius:999px;font-size:11px;font-weight:800}.msg{margin-top:10px;font-size:13px;color:#b54b62}.ok{color:#237b59}.top button{background:white;border:1px solid var(--line)}@media(max-width:720px){.wrap{padding:14px}.grid{grid-template-columns:1fr 1fr}.school{flex-direction:column}.auth{margin:3vh auto}.card{border-radius:22px}}</style></head><body>
<div class="wrap"><div class="top"><div class="brand">School<span>Link</span></div><button id="logout" class="hidden">Гарах</button></div>
<section id="auth" class="card auth"><div class="muted">LIVE TEST</div><h1>SchoolLink-д нэвтрэх</h1><p class="muted">Өөрийн account-аар бүртгүүлээд Owner хэсгээ туршаарай.</p><input id="email" type="email" placeholder="И-мэйл"><input id="password" type="password" placeholder="Нууц үг"><button class="primary" id="signin" type="button">Нэвтрэх</button><button class="ghost" id="signup" type="button">Анх удаа бол бүртгэл үүсгэх</button><div id="authmsg" class="msg"></div></section>
<section id="app" class="hidden"><div class="card hero"><div class="muted" style="color:#aaa8bd">PLATFORM OWNER</div><h1 style="margin:6px 0 8px">SchoolLink Owner Dashboard</h1><small id="ownerEmail"></small></div><div id="metrics" class="grid"></div><div class="card" style="margin-top:14px"><h3 style="margin-top:0">Сургуулиуд</h3><div id="schools" class="schools"><div class="muted">Ачаалж байна…</div></div></div></section>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1/dist/umd/supabase.min.js"></script><script>
const URL='https://cfyxcopixetvlvhjftxv.supabase.co';const KEY='sb_publishable_1qWG5IZvHmfEOADJwCGhFg_79aZgQDq';
const $=id=>document.getElementById(id);const msg=(t,ok=false)=>{$('authmsg').textContent=t;$('authmsg').className='msg'+(ok?' ok':'')};
let sb=null;try{if(!window.supabase?.createClient)throw new Error('Supabase client ачаалсангүй.');sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){msg(e.message||'Supabase эхлүүлэхэд алдаа гарлаа.')}
async function load(){if(!sb)return;const {data:{user}}=await sb.auth.getUser();if(!user){$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('ownerEmail').textContent=user.email||'';const {data,error}=await sb.functions.invoke('schoollink-owner-dashboard',{body:{action:'overview'}});if(error||data?.error){$('schools').innerHTML='<div class="msg">'+esc(data?.error||error?.message||'Owner мэдээлэл авч чадсангүй')+'</div>';return}const m=data.metrics||{};$('metrics').innerHTML=[['Сургууль',m.schools],['Хэрэглэгч',m.users],['Багш',m.teachers],['Сурагч',m.students]].map(x=>'<div class="stat"><b>'+(x[1]||0)+'</b><span>'+x[0]+'</span></div>').join('');$('schools').innerHTML=(data.schools||[]).map(s=>'<div class="school"><div><b>'+esc(s.name||'Сургууль')+'</b><small>'+(s.counts?.students||0)+' сурагч · '+(s.counts?.teachers||0)+' багш · '+(s.counts?.parents||0)+' эцэг эх</small></div><span class="pill">'+esc(s.subscription?.plan||'trial')+'</span></div>').join('')||'<div class="muted">Одоогоор сургууль алга байна.</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function creds(){const email=String($('email').value||'').trim().toLowerCase();const password=String($('password').value||'');if(!email||!email.includes('@')){msg('И-мэйлээ зөв оруулна уу.');return null}if(password.length<6){msg('Нууц үг хамгийн багадаа 6 тэмдэгт байна.');return null}return {email,password}}
$('signin').addEventListener('click',async()=>{msg('');if(!sb)return msg('Supabase client ачаалагдаагүй байна.');const c=creds();if(!c)return;$('signin').disabled=true;msg('Нэвтэрч байна…',true);try{const {error}=await sb.auth.signInWithPassword(c);if(error)return msg(error.message);await load()}catch(e){msg(e.message||'Нэвтрэхэд алдаа гарлаа.')}finally{$('signin').disabled=false}});
$('signup').addEventListener('click',async()=>{msg('');if(!sb)return msg('Supabase client ачаалагдаагүй байна.');const c=creds();if(!c)return;$('signup').disabled=true;msg('Бүртгэл үүсгэж байна…',true);try{const {data,error}=await sb.auth.signUp({email:c.email,password:c.password,options:{emailRedirectTo:location.origin}});if(error)return msg(error.message);if(data.session){msg('Бүртгэл амжилттай. Нэвтэрлээ.',true);await load()}else msg('Бүртгэл үүслээ. И-мэйлд ирсэн баталгаажуулах холбоосыг дараад дараа нь Нэвтрэх дарна уу.',true)}catch(e){msg(e.message||'Бүртгэл үүсгэхэд алдаа гарлаа.')}finally{$('signup').disabled=false}});
$('logout').addEventListener('click',async()=>{if(sb)await sb.auth.signOut();load()});if(sb){sb.auth.onAuthStateChange(()=>setTimeout(load,0));load()}
</script></body></html>
