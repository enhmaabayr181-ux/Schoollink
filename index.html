<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SchoolLink</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1/dist/umd/supabase.min.js"></script>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17151f;background:#f6f5fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#eee9ff 0,transparent 38%),#f7f7fb}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,430px);background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border:1px solid rgba(115,90,180,.12);border-radius:28px;padding:28px;box-shadow:0 24px 80px rgba(66,44,110,.12)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#6d4aff;color:#fff;font-size:24px}.brand h1{margin:0;font-size:24px}.muted{color:#736f7d;font-size:14px;line-height:1.55}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;height:50px;border-radius:15px;border:1px solid #ddd9e7;background:#fff;padding:0 15px;font-size:16px;outline:none}input:focus{border-color:#8068ff;box-shadow:0 0 0 4px rgba(128,104,255,.1)}
    .actions{display:grid;gap:10px;margin-top:20px}.btn{height:50px;border:0;border-radius:15px;font-weight:800;font-size:15px;cursor:pointer;touch-action:manipulation;position:relative;z-index:2}.primary{background:#6d4aff;color:white}.secondary{background:#efecff;color:#573bc8}.btn:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:16px;padding:12px 14px;border-radius:14px;background:#f1eff7;font-size:13px;line-height:1.5;display:none;white-space:pre-wrap}.status.show{display:block}.status.error{background:#fff0f0;color:#a12b2b}.status.ok{background:#ebfff5;color:#13714b}.dashboard{display:none}.dashboard.show{display:block}.auth.hidden{display:none}.owner{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eee9ff;color:#5b40ca;font-weight:800;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.metric{background:#fff;border:1px solid #ebe8f1;border-radius:18px;padding:15px}.metric b{display:block;font-size:24px;margin-top:5px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.linkbtn{border:0;background:transparent;color:#6d4aff;font-weight:800;cursor:pointer;padding:8px}
  </style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <div class="brand"><div class="logo">S</div><div><h1>SchoolLink</h1><div class="muted">School–Family platform</div></div></div>
    <section id="auth" class="auth">
      <p class="muted">Эхний удаа бол <b>Бүртгэл үүсгэх</b>. Өмнө бүртгэлтэй бол <b>Нэвтрэх</b>.</p>
      <label for="email">И-мэйл</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" />
      <label for="password">Нууц үг</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <div class="actions"><button id="loginBtn" class="btn primary" type="button">Нэвтрэх</button><button id="signupBtn" class="btn secondary" type="button">Анх удаа бол бүртгэл үүсгэх</button></div>
      <div id="status" class="status"></div>
    </section>
    <section id="dashboard" class="dashboard">
      <div class="top"><div><span class="owner">◆ Platform Owner</span><h2 style="margin:12px 0 4px">Owner Dashboard</h2><div id="ownerEmail" class="muted"></div></div><button id="logoutBtn" class="linkbtn">Гарах</button></div>
      <div id="ownerStatus" class="status show">Мэдээлэл ачаалж байна…</div><div id="metrics" class="metrics"></div>
    </section>
  </main>
</div>
<script>
(() => {
  const SUPABASE_URL='https://cfyxcopixetvlvhjftxv.supabase.co';
  const SUPABASE_KEY='sb_publishable_1qWG5IZvHmfEOADJwCGhFg_79aZgQDq';
  const $=id=>document.getElementById(id);
  const status=$('status'), auth=$('auth'), dashboard=$('dashboard'), ownerStatus=$('ownerStatus'), metrics=$('metrics');
  let sb;
  try{
    if(!window.supabase?.createClient) throw new Error('Supabase library ачаалсангүй. Интернэтээ шалгаад refresh хийнэ үү.');
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  }catch(e){showStatus(e.message,'error');return;}
  function showStatus(message,type=''){status.textContent=message;status.className='status show'+(type?' '+type:'');}
  function setBusy(v){$('loginBtn').disabled=v;$('signupBtn').disabled=v;}
  function creds(){const email=$('email').value.trim().toLowerCase();const password=$('password').value;if(!email||!/^\S+@\S+\.\S+$/.test(email))throw new Error('Зөв и-мэйл оруулна уу.');if(!password||password.length<6)throw new Error('Нууц үг хамгийн багадаа 6 тэмдэгт байна.');return{email,password};}
  async function signUp(){try{setBusy(true);showStatus('Бүртгэл үүсгэж байна…');const c=creds();const {data,error}=await sb.auth.signUp({email:c.email,password:c.password,options:{emailRedirectTo:location.origin}});if(error)throw error;if(data.session){showStatus('Бүртгэл амжилттай. Нэвтэрлээ.','ok');await routeSession(data.session);}else showStatus('Бүртгэл үүслээ. И-мэйл баталгаажуулах захиа ирсэн бол баталгаажуулаад дараа нь Нэвтрэх дарна уу.','ok');}catch(e){showStatus('Бүртгүүлэх алдаа: '+(e.message||e),'error');}finally{setBusy(false);}}
  async function signIn(){try{setBusy(true);showStatus('Нэвтэрч байна…');const c=creds();const {data,error}=await sb.auth.signInWithPassword({email:c.email,password:c.password});if(error)throw error;showStatus('Амжилттай нэвтэрлээ.','ok');await routeSession(data.session);}catch(e){showStatus('Нэвтрэх алдаа: '+(e.message||e),'error');}finally{setBusy(false);}}
  async function routeSession(session){if(!session)return;auth.classList.add('hidden');dashboard.classList.add('show');$('ownerEmail').textContent=session.user?.email||'';await loadOwner(session.access_token);}
  async function loadOwner(token){ownerStatus.textContent='Owner эрх шалгаж байна…';ownerStatus.className='status show';metrics.innerHTML='';try{const res=await fetch(SUPABASE_URL+'/functions/v1/schoollink-owner-dashboard',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPABASE_KEY},body:JSON.stringify({action:'overview'})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Owner мэдээлэл татаж чадсангүй.');ownerStatus.textContent='Owner эрх баталгаажлаа ✅';ownerStatus.className='status show ok';const m=data.metrics||{};metrics.innerHTML=[['Сургууль',m.schools||0],['Хэрэглэгч',m.users||0],['Багш',m.teachers||0],['Эцэг эх',m.parents||0],['Сурагч',m.students||0],['Анги',m.classes||0]].map(x=>`<div class="metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');}catch(e){ownerStatus.textContent='Owner Dashboard: '+(e.message||e);ownerStatus.className='status show error';}}
  $('loginBtn').onclick=signIn;$('signupBtn').onclick=signUp;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();dashboard.classList.remove('show');auth.classList.remove('hidden');showStatus('Гарлаа.','ok');};
  sb.auth.getSession().then(({data})=>{if(data.session)routeSession(data.session);});
})();
</script>
</body></html>
